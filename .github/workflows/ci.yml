name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which areas changed. Each area's job runs only when its folders (or
  # this workflow) change. "CI result" is the single required check.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      database: ${{ steps.filter.outputs.database }}
      api: ${{ steps.filter.outputs.api }}
      python: ${{ steps.python.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            flutter:
              - *workflow
              - apps/**
              - packages/**
              - tool/**
              - pubspec.yaml
              - pubspec.lock
              - analysis_options.yaml
            api:
              - *workflow
              - services/api/**
            pipeline:
              - *workflow
              - services/pipeline/**
            seo:
              - *workflow
              - services/seo/**
            database:
              - *workflow
              - supabase/**
      - name: Python services to check
        id: python
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          echo "services=$(jq -c '[.[] | select(. == "api" or . == "pipeline" or . == "seo")]' <<< "$CHANGED")" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter (analyze + test)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Get dependencies (workspace)
        run: flutter pub get
      - name: Localisation files are up to date
        working-directory: apps/app
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
      - name: Format
        run: dart format --output=none --set-exit-if-changed apps packages tool
      - name: Analyze
        run: flutter analyze
      - name: Import boundaries
        run: dart run tool/check_import_boundaries.dart
      - name: Test packages/core
        working-directory: packages/core
        run: dart test
      - name: Test packages/ui_kit
        working-directory: packages/ui_kit
        run: flutter test
      - name: Test apps/app
        working-directory: apps/app
        run: flutter test
      - name: Test apps/console
        working-directory: apps/console
        run: flutter test

  python:
    name: Python (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Import boundaries
        run: |
          if grep -q '^\[tool.importlinter\]' pyproject.toml; then
            uv run lint-imports
          else
            echo "No import-linter contracts in this service yet."
          fi
      - run: uv run pytest -q

  api-image:
    name: API image (docker build)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t prepvruksha-api:ci services/api
      - name: Starts and answers /health
        run: |
          docker run -d --name api -p 8080:8080 -e APP_ENV=dev prepvruksha-api:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 localhost:8080/health
      - name: Refuses to start in prod with development settings
        run: |
          if docker run --rm -e APP_ENV=prod prepvruksha-api:ci; then
            echo "The image started in prod with the log OTP sender"; exit 1
          fi

  database:
    name: Database (migrations + RLS tests)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start Postgres and apply migrations + seed
        run: supabase db start
      - name: Lint schema
        run: supabase db lint --fail-on error
      - name: pgTAP tests
        run: supabase test db

  # Always runs (no path filter): scans the whole git history for secrets.
  # gitleaks-action needs a paid licence for organisations, so the pinned
  # binary is downloaded and its checksum checked instead.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  # The only check branch protection requires. Passes when every job that ran
  # passed; skipped jobs (unchanged areas) count as passing.
  result:
    name: CI result
    needs: [changes, secrets, flutter, python, api-image, database]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "A CI job failed or was cancelled."
            exit 1
          fi
