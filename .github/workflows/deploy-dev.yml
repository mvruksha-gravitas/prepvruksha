name: Deploy dev

# Deploys to prepvruksha-dev after CI passes on main, per area and in this
# order: database (supabase/** changed), then the API (services/api changed),
# then the web app (the app or its packages changed). A failed step stops the
# ones after it. The staff console (apps/console) deploys alongside the web
# app, to its own Hosting site. Run it by hand (Actions > Deploy dev > Run
# workflow) too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        # both = API + web app + console; all = database, then API, then both apps.
        options: [both, all, database, api, web, console]
        default: both

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: prepvruksha-dev
  REGION: asia-south1
  SERVICE: prepvruksha-api
  IMAGE: asia-south1-docker.pkg.dev/prepvruksha-dev/prepvruksha/api
  SUPABASE_PROJECT_REF: hzpuxfgfheizghpipmew
  # Session pooler (IPv4) of prepvruksha-dev; not secret.
  SUPABASE_POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com

jobs:
  changes:
    name: Decide what to deploy
    # Only after a successful CI run for a push to main (not for PRs).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      database: ${{ steps.decide.outputs.database }}
      api: ${{ steps.decide.outputs.api }}
      web: ${{ steps.decide.outputs.web }}
      console: ${{ steps.decide.outputs.console }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Changed areas
        id: decide
        env:
          TARGET: ${{ inputs.target }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$TARGET" in all|database) echo "database=true" >> "$GITHUB_OUTPUT" ;; esac
            case "$TARGET" in all|both|api) echo "api=true" >> "$GITHUB_OUTPUT" ;; esac
            case "$TARGET" in all|both|web) echo "web=true" >> "$GITHUB_OUTPUT" ;; esac
            case "$TARGET" in all|both|console) echo "console=true" >> "$GITHUB_OUTPUT" ;; esac
            exit 0
          fi
          # Everything the merge brought into main (first parent = previous main).
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          workflow='^\.github/workflows/deploy-dev\.yml$'
          grep -qE "^supabase/" <<< "$changed" && echo "database=true" >> "$GITHUB_OUTPUT"
          grep -qE "^services/api/|^infra/cloudrun/|$workflow" <<< "$changed" && echo "api=true" >> "$GITHUB_OUTPUT"
          grep -qE "^apps/app/|^packages/(core|ui_kit)/|^pubspec\.(yaml|lock)$|^firebase\.json$|$workflow" <<< "$changed" && echo "web=true" >> "$GITHUB_OUTPUT"
          grep -qE "^apps/console/|^packages/(core|ui_kit)/|^pubspec\.(yaml|lock)$|^firebase\.json$|^\.firebaserc$|$workflow" <<< "$changed" && echo "console=true" >> "$GITHUB_OUTPUT"
          true

  database:
    name: Push migrations + seed (Supabase)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    # The only credential is SUPABASE_DB_PASSWORD, a secret of the "dev"
    # environment (Settings > Environments), limited to main. No Supabase
    # access token: `supabase link` would need to read the project's API keys.
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Database connection
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Set SUPABASE_DB_PASSWORD in the dev environment (see infra/README.md)"
            exit 1
          fi
          password=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$password"
          echo "DB_URL=postgresql://postgres.$SUPABASE_PROJECT_REF:$password@$SUPABASE_POOLER_HOST:5432/postgres" >> "$GITHUB_ENV"
      - name: Pending changes
        run: supabase db push --db-url "$DB_URL" --include-seed --dry-run
      - name: Push migrations and seed
        run: supabase db push --db-url "$DB_URL" --include-seed --yes
      - name: Every migration is applied
        run: |
          supabase db push --db-url "$DB_URL" --dry-run 2>&1 | tee dry-run.log
          grep -q "database is up to date" dry-run.log

  api:
    name: Deploy API (Cloud Run)
    needs: [changes, database]
    # After the database step when it ran; never after a failed one.
    if: >-
      always() && needs.changes.outputs.api == 'true' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        env:
          TAG: ${{ env.IMAGE }}:${{ needs.changes.outputs.sha }}
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -t "$TAG" services/api
          docker push "$TAG"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --image="$IMAGE:${{ needs.changes.outputs.sha }}" \
            --service-account="api-runtime@$PROJECT.iam.gserviceaccount.com" \
            --env-vars-file=infra/cloudrun/api-dev.env.yaml \
            --set-secrets=SUPABASE_SECRET_KEY=SUPABASE_SECRET_KEY:latest,OTP_HMAC_KEY=OTP_HMAC_KEY:latest \
            --min-instances=0 --max-instances=2 --memory=512Mi --cpu=1 \
            --quiet
      - name: Health check
        run: |
          url=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url/health" | tee /dev/stderr | grep -q '"env":"dev"'

  web:
    name: Deploy web app (Firebase Hosting)
    needs: [changes, database, api]
    # Last: after the database and API steps that ran; never after a failed one.
    if: >-
      always() && needs.changes.outputs.web == 'true' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Get dependencies (workspace)
        run: flutter pub get
      - name: Write the dev app config
        # Repository variables, not secrets: the publishable key and URLs are public.
        env:
          SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
          API_URL: ${{ vars.DEV_API_URL }}
        run: |
          jq -n '{APP_ENV: "dev", SUPABASE_URL: env.SUPABASE_URL,
                  SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY, API_URL: env.API_URL}' \
            > "$RUNNER_TEMP/dev.json"
          jq -e 'all(.[]; . != "")' "$RUNNER_TEMP/dev.json" > /dev/null || {
            echo "Set the DEV_* repository variables (see infra/README.md)"; exit 1; }
      - name: Build
        working-directory: apps/app
        run: flutter build web --release --dart-define-from-file="$RUNNER_TEMP/dev.json"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting:app --project="$PROJECT" --non-interactive

  console:
    name: Deploy staff console (Firebase Hosting)
    needs: [changes, database, api]
    # Same order rule as the web app: after the steps that ran; never after a failed one.
    if: >-
      always() && needs.changes.outputs.console == 'true' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Get dependencies (workspace)
        run: flutter pub get
      - name: Write the dev app config
        # Same public values as the web app (repository variables).
        env:
          SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
          API_URL: ${{ vars.DEV_API_URL }}
        run: |
          jq -n '{APP_ENV: "dev", SUPABASE_URL: env.SUPABASE_URL,
                  SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY, API_URL: env.API_URL}'             > "$RUNNER_TEMP/dev.json"
          jq -e 'all(.[]; . != "")' "$RUNNER_TEMP/dev.json" > /dev/null || {
            echo "Set the DEV_* repository variables (see infra/README.md)"; exit 1; }
      - name: Build
        working-directory: apps/console
        run: flutter build web --release --dart-define-from-file="$RUNNER_TEMP/dev.json"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: Deploy to Firebase Hosting
        # The site is created once by a person (infra/README.md, "Staff console").
        run: npx --yes firebase-tools@14 deploy --only hosting:console --project="$PROJECT" --non-interactive
